<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>向宣丞</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#000;overflow:hidden;-webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;left:50%;top:50%;transform-origin:center center;
  width:375px;height:667px;overflow:hidden;
  transform:translate(-50%,-50%);
  background:#0b1a2b;
}
#track{position:absolute;inset:0;display:flex;transition:transform .5s cubic-bezier(.22,.86,.28,1)}
.slide{position:relative;flex:0 0 100%;width:100%;height:100%;overflow:hidden}

/* ===== 第 1 页 ===== */
#p1{
  background:
    radial-gradient(120% 70% at 80% 6%, rgba(201,162,39,.20) 0%, rgba(201,162,39,0) 58%),
    radial-gradient(100% 80% at 8% 96%, rgba(58,120,190,.28) 0%, rgba(58,120,190,0) 62%),
    linear-gradient(165deg,#081626 0%,#0b1a2b 48%,#123050 100%);
  color:#fff;
  display:flex;flex-direction:column;
  padding:0 28px;
}
#p1::after{
  content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  right:-140px;top:-80px;pointer-events:none;
  border:1px solid rgba(201,162,39,.26);
  box-shadow:0 0 0 32px rgba(201,162,39,.05),0 0 0 64px rgba(201,162,39,.028);
}
.p1-top{
  position:relative;z-index:2;display:flex;align-items:center;gap:9px;
  padding-top:46px;
}
.seal{
  width:30px;height:30px;flex:0 0 auto;border:1.4px solid #c9a227;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#c9a227;
}
.p1-top .t{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.5)}
.p1-mid{position:relative;z-index:2;margin:auto 0}
.tag{
  display:inline-block;font-size:10.5px;letter-spacing:.2em;color:#e6cd75;
  border:1px solid rgba(201,162,39,.42);border-radius:2px;
  padding:4px 10px;margin-bottom:22px;
}
h1{font-size:46px;line-height:1.16;font-weight:800;letter-spacing:.04em;margin-bottom:8px}
.en{font-size:11px;letter-spacing:.36em;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:20px}
.rule{width:34px;height:2px;background:#c9a227;margin-bottom:18px}
.desc{font-size:13.5px;line-height:2;color:rgba(255,255,255,.72);letter-spacing:.05em}
.desc b{color:#fff;font-weight:600}
.p1-foot{
  position:relative;z-index:2;margin-top:auto;padding-bottom:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.p1-foot .hint{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.36)}
.arrow{
  font-size:14px;color:rgba(201,162,39,.85);
  animation:slide 1.8s ease-in-out infinite;
}
@keyframes slide{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(6px);opacity:1}}

/* ===== 第 2 页 ===== */
#p2{
  background:
    radial-gradient(90% 60% at 50% 0%, rgba(201,162,39,.14) 0%, rgba(201,162,39,0) 62%),
    linear-gradient(175deg,#081626 0%,#0b1a2b 46%,#14304e 100%);
  color:#fff;
  display:flex;flex-direction:column;align-items:center;
}
.q-top{position:relative;z-index:2;width:100%;padding:52px 28px 0;text-align:center}
.q-eyebrow{font-size:10px;letter-spacing:.26em;color:#e6cd75;margin-bottom:10px}
.q-title{font-size:19px;font-weight:800;letter-spacing:.06em;margin-bottom:6px}
.q-sub{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.05em}

.q-card{
  position:relative;z-index:2;
  margin:24px auto 0;width:212px;height:212px;
  background:#fff;border-radius:8px;padding:10px;
  box-shadow:0 16px 44px rgba(0,0,0,.42);
}
.q-card img{width:100%;height:100%;display:block;border-radius:3px;image-rendering:pixelated}
.q-note{
  position:relative;z-index:2;margin-top:14px;
  font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.42);
  display:flex;align-items:center;gap:6px;
}
.q-note i{width:5px;height:5px;border-radius:50%;background:#c9a227;display:block}
.q-foot{position:relative;z-index:2;margin-top:auto;padding-bottom:52px;text-align:center}
.q-foot .n{font-size:14px;font-weight:700;letter-spacing:.14em;margin-bottom:4px}
.q-foot .s{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.32)}

/* ===== BGM 开关 ===== */
#bgmBtn{
  position:absolute;right:14px;top:14px;z-index:60;
  width:30px;height:30px;border:0;padding:0;background:transparent;cursor:pointer;
}
#bgmBtn .disc{
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.32);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:opacity .3s,border-color .3s;
}
#bgmBtn svg{width:14px;height:14px;display:block;color:#fff}
#bgmBtn.playing .disc{animation:spin 6s linear infinite;border-color:rgba(201,162,39,.6)}
#bgmBtn.playing svg{color:#e6cd75}
#bgmBtn.paused .disc{opacity:.6}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ===== 圆点 ===== */
#dots{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:30}
#dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .3s}
#dots i.on{background:#e6cd75;width:15px;border-radius:3px}

/* 放大层 */
#zoom{position:fixed;inset:0;z-index:200;background:rgba(4,10,18,.94);display:none;align-items:center;justify-content:center;padding:24px}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:6px}
</style>
</head>

  <div id="track">

<script>
(function(){
  var stage=document.getElementById('stage'), track=document.getElementById('track');
  var slides=track.querySelectorAll('.slide'), dots=document.querySelectorAll('#dots i');
  var idx=0, BW=375, BH=667;

  function fit(){
    var s=Math.min(window.innerWidth/BW, window.innerHeight/BH);
    stage.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  fit(); window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,120)});

  function go(n){
    n=Math.max(0,Math.min(slides.length-1,n));
    if(n===idx) return;
    idx=n;
    track.style.transform='translateX('+(-idx*100)+'%)';
    for(var i=0;i<dots.length;i++) dots[i].className = i===idx?'on':'';
  }

  var sx=0, sy=0, drag=false, lock=null, moved=0;
  function start(x,y){sx=x;sy=y;drag=true;lock=null;moved=0;}
  function move(x,y,ev){
    if(!drag) return;
    var dx=x-sx, dy=y-sy;
    moved=Math.max(moved,Math.abs(dx));
    if(lock===null && (Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(lock==='x'&&ev&&ev.preventDefault) ev.preventDefault();
  }
  function end(x){
    if(!drag) return;
    drag=false;
    var dx=x-sx;
    if(lock==='x' && Math.abs(dx)>40) go(idx+(dx<0?1:-1));
    lock=null;
  }
  track.addEventListener('touchstart',function(e){var t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  track.addEventListener('touchmove',function(e){var t=e.touches[0];move(t.clientX,t.clientY,e);},{passive:false});
  track.addEventListener('touchend',function(e){var t=e.changedTouches[0];end(t.clientX);},{passive:true});
  track.addEventListener('mousedown',function(e){start(e.clientX,e.clientY);});
  window.addEventListener('mousemove',function(e){if(drag)move(e.clientX,e.clientY,e);});
  window.addEventListener('mouseup',function(e){if(drag)end(e.clientX);});
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight')go(idx+1);
    if(e.key==='ArrowLeft')go(idx-1);
  });
  track.addEventListener('click',function(e){
    if(moved>10) return;
    if(e.target.closest('.q-card')) return;
    var r=stage.getBoundingClientRect(), rel=(e.clientX-r.left)/r.width;
    if(rel>0.78) go(idx+1); else if(rel<0.22) go(idx-1);
  });

  // BGM
  var audio=document.getElementById('bgm'), btn=document.getElementById('bgmBtn');
  function paint(on){ btn.className = on?'playing':'paused'; }
  function play(){
    var p=audio.play();
    if(p&&p.catch){ p.then(function(){paint(true);}).catch(function(){paint(false);}); }
    else paint(true);
  }
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    if(audio.paused) play(); else { audio.pause(); paint(false); }
  });
  function kick(){
    if(!audio.paused) return;
    play();
    window.removeEventListener('touchstart',kick);
    window.removeEventListener('click',kick);
  }
  window.addEventListener('touchstart',kick,{passive:true});
  window.addEventListener('click',kick);
  play();

  // 二维码放大
  var zoom=document.getElementById('zoom'), zi=document.getElementById('zoomImg');
  var qr=document.getElementById('qrImg');
  qr.addEventListener('click',function(){ zi.src=qr.src; zoom.classList.add('on'); });
  zoom.addEventListener('click',function(){ zoom.classList.remove('on'); });
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
})();
</script>
